const DIR={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0],W:[0,0]};
const kk=(x,y)=>x+','+y;
function parseLevel(def){
  const rows=def.map,h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const L={name:def.name,hint:def.hint||'',w,h,wall:[],start:null,exit:null,plates:[],doors:{},spikes:{},tele:{},conv:{},tp:{},lasers:{},
    guards:(def.guards||[]).map(g=>g.map(p=>({x:p[0],y:p[1]}))),max:def.max||3,par:def.par||2};
  for(let y=0;y<h;y++){L.wall.push([]);for(let x=0;x<w;x++){const c=rows[y][x]||'#';L.wall[y].push(c==='#');
    if(c==='S')L.start={x,y};else if(c==='E')L.exit={x,y};
    else if(c>='a'&&c<='d')L.plates.push({x,y,c});
    else if(c>='A'&&c<='D')L.doors[kk(x,y)]=c.toLowerCase();
    else if(c==='x')L.spikes[kk(x,y)]=1;
    else if('^v<>'.includes(c))L.conv[kk(x,y)]=c;
    else if(c==='l'||c==='m')L.lasers[kk(x,y)]=c==='l'?0:1;
    else if(c>='1'&&c<='4'){(L.tp[c]=L.tp[c]||[]).push({x,y})}}}
  for(const c in L.tp){const a=L.tp[c];if(a.length===2){L.tele[kk(a[0].x,a[0].y)]=a[1];L.tele[kk(a[1].x,a[1].y)]=a[0]}}
  return L;}
const isWall=(L,x,y)=>x<0||y<0||x>=L.w||y>=L.h||L.wall[y][x];
const clonePos=(p,t)=>p[Math.min(t,p.length-1)];
const guardPos=(L,i,t)=>{const g=L.guards[i];return g[t%g.length]};
function platesOn(L,c,act){return L.plates.filter(p=>p.c===c).every(p=>act.some(a=>a.x===p.x&&a.y===p.y))}
const doorOpen=(L,x,y,act)=>{const c=L.doors[kk(x,y)];return !c||platesOn(L,c,act)};
const actorsAt=(clones,cur,t)=>{const a=clones.map(p=>clonePos(p,t));if(cur)a.push(cur);return a};
function tryMove(L,clones,pos,t,mv){
  const d=DIR[mv],nx=pos.x+d[0],ny=pos.y+d[1];
  if(mv!=='W'){if(isWall(L,nx,ny))return{ok:false};
    if(!doorOpen(L,nx,ny,actorsAt(clones,pos,t)))return{ok:false};}
  let dead=!!L.spikes[kk(nx,ny)];
  let fx=nx,fy=ny;const tl=L.tele[kk(nx,ny)];if(tl&&mv!=='W'){fx=tl.x;fy=tl.y}
  const cv=L.conv[kk(fx,fy)];if(cv&&mv!=='W'){const q={'^':[0,-1],'v':[0,1],'<':[-1,0],'>':[1,0]}[cv],cx=fx+q[0],cy=fy+q[1];if(!isWall(L,cx,cy)&&doorOpen(L,cx,cy,actorsAt(clones,pos,t))){fx=cx;fy=cy;if(L.spikes[kk(fx,fy)])dead=true}}
  const lz=L.lasers[kk(fx,fy)];if(lz!==undefined&&(((t+1)>>1)&1)===lz)dead=true;
  L.guards.forEach((g,i)=>{const g1=guardPos(L,i,t+1),g0=guardPos(L,i,t);
    if(g1.x===fx&&g1.y===fy)dead=true;
    if(g0.x===fx&&g0.y===fy&&g1.x===pos.x&&g1.y===pos.y)dead=true;});
  return{ok:true,pos:{x:fx,y:fy},dead};}
function bfsRun(L,clones,TMAX){
  const nodes=[{x:L.start.x,y:L.start.y,t:0,par:-1,mv:''}],seen=new Set([L.start.x+','+L.start.y+',0']);
  for(let i=0;i<nodes.length;i++){const n=nodes[i];if(n.t>=TMAX)continue;
    for(const mv of['W','U','D','L','R']){const r=tryMove(L,clones,n,n.t,mv);if(!r.ok||r.dead)continue;
      const k=r.pos.x+','+r.pos.y+','+(n.t+1);if(seen.has(k))continue;seen.add(k);
      nodes.push({x:r.pos.x,y:r.pos.y,t:n.t+1,par:i,mv});}}
  return nodes;}
function pathOf(nodes,i){const mvs=[],pos=[];for(let j=i;j>=0;j=nodes[j].par){pos.unshift({x:nodes[j].x,y:nodes[j].y});if(j)mvs.unshift(nodes[j].mv)}return{mvs,pos}}
function solve(L,maxRuns,TMAX=48,clones=[],sol=[]){
  const nodes=bfsRun(L,clones,TMAX);
  const ei=nodes.findIndex(n=>n.x===L.exit.x&&n.y===L.exit.y);
  if(ei>=0)return sol.concat([pathOf(nodes,ei).mvs]);
  if(clones.length>=maxRuns)return null;
  const tried=new Set();
  for(let i=0;i<nodes.length;i++){const n=nodes[i];if(!L.plates.some(p=>p.x===n.x&&p.y===n.y))continue;
    const k=n.x+','+n.y;if(tried.has(k))continue;tried.add(k);
    const p=pathOf(nodes,i),r=solve(L,maxRuns,TMAX,clones.concat([p.pos]),sol.concat([p.mvs]));if(r)return r;}
  return null;}
const LEVELS=[{"name":"أول حلقة","hint":"قف على اللوحة، ابدأ حلقة جديدة، وبعدين نسختك هتفتحلك الباب","par":1,"max":2,"map":["#########","#S.a.A.E#","#########"]},{"name":"بابين ورا بعض","hint":"كل نسخة بتعيد حركاتك بالظبط","par":2,"max":3,"map":["#########","#S.a.A..#","#######.#","#E.B.b..#","#########"]},{"name":"الحارس","hint":"استخبى في الحفرة لما الحارس يعدي","par":0,"max":1,"map":["#########","#S.....E#","##.##.###","##.##.###","#########"],"guards":[[[2,1],[3,1],[4,1],[5,1],[6,1],[5,1],[4,1],[3,1]]]},{"name":"الأشواك","hint":"الأشواك بتقتلك بس. النسخ مش بتتأذي","par":1,"max":2,"map":["#########","#S.x.x.E#","#a#.#.#A#","#.......#","#########"]},{"name":"الغرفة المحروسة","hint":"النسخة بتفتح الباب والحارس بيلف في الأوضة التانية","par":1,"max":2,"map":["#########","#S..#..E#","#...A...#","#.a.#...#","#########"],"guards":[[[5,1],[6,1],[7,1],[7,2],[7,3],[6,3],[5,3],[5,2]]]},{"name":"اتنين لازم مع بعض","hint":"الباب مش بيفتح غير لما كل اللوح عليها حد. استنى لو احتجت","par":2,"max":3,"map":["#########","#a.S..a.#","####A####","####E####","#########"]},{"name":"الممر الطويل","hint":"الحارس واقف عند اللوحة التانية. حاول توقيتك","par":2,"max":3,"map":["###########","#S.a.A....#","#########.#","#E.B.b....#","########.##","###########"],"guards":[[[9,3],[8,3],[7,3],[8,3]]]},{"name":"الحارس والتوأم","hint":"لوحتين والحارس رايح جاي بينهم","par":2,"max":3,"map":["###.#.###","#a.S..a.#","####A####","####E####","#########"],"guards":[[[4,1],[5,1],[6,1],[5,1]]]},{"map":["#########","#BE#..###","#.#..##.#","#A......#","##....ab#","##b..S#.#","#########"],"guards":[[[3,3],[4,3],[5,3],[6,3],[5,3],[4,3]]],"max":3,"par":3,"name":"حراسة 1","hint":"الحارس بيروح ويجي. وقتك صح"},{"map":["#########","#E#m.#a##","#..#.#..#","##A....##","#..a#l#.#","##.Sm.#.#","#########"],"guards":[],"max":3,"par":2,"name":"ليزر 1","hint":"الليزر بيشتغل ويقف كل ثانيتين. النسخ مش بيأذيها"},{"map":["#########","#.#aa..1#","#EB..A..#","#.#b#...#","###...1##","#..#Sb..#","#########"],"guards":[],"max":3,"par":2,"name":"بوابات 1","hint":"المشي على الدايرة بيرميك للدايرة التانية. النسخ كمان بتستخدمها"},{"map":["#########","#Sb#.#ax#","#....a.x#","##.A...##","#.b.#x..#","##.#EB.##","#########"],"guards":[],"max":3,"par":2,"name":"أشواك 1","hint":"الأشواك ليك بس. النسخ بتعدي عليها"},{"map":["#########","##..#.#.#","#....a..#","#.#..##.#","#....#E##","#Sa.A1.1#","#########"],"guards":[],"max":3,"par":2,"name":"بوابات 2","hint":"المشي على الدايرة بيرميك للدايرة التانية. النسخ كمان بتستخدمها"},{"map":["#########","#.m.#..a#","#..Sl...#","#.a.#B#.#","#..#b..##","#.mA.b.E#","#########"],"guards":[],"max":3,"par":2,"name":"ليزر 2","hint":"الليزر بيشتغل ويقف كل ثانيتين. النسخ مش بيأذيها"},{"map":["#########","#E.#.#..#","#.A##..a#","##.....a#","##..#...#","#...S...#","#########"],"guards":[[[5,3],[5,4],[5,5],[5,4]]],"max":3,"par":2,"name":"حراسة 2","hint":"الحارس بيروح ويجي. وقتك صح"},{"map":["#########","##.#..#.#","#...B.AE#","##.###.x#","##..a#x##","#.x.S.b.#","#########"],"guards":[],"max":3,"par":2,"name":"أشواك 2","hint":"الأشواك ليك بس. النسخ بتعدي عليها"},{"map":["#########","#E...>.a#","#.###..>#","#A..>.S.#","#.<.#..a#","#>.....##","#########"],"guards":[],"max":3,"par":2,"name":"سيور 1","hint":"الأسهم بتزقك خطوة زيادة في اتجاهها"},{"map":["#########","#S.bA..E#","##...#.##","#v..#..##","#.a>.<v##","#a..<.#B#","#########"],"guards":[],"max":3,"par":2,"name":"سيور 2","hint":"الأسهم بتزقك خطوة زيادة في اتجاهها"},{"map":["#########","#b..##.##","#...aA>.#","##..SB<##","#vbv#...#","##.#E.^.#","#########"],"guards":[],"max":3,"par":2,"name":"سيور 3","hint":"الأسهم بتزقك خطوة زيادة في اتجاهها"},{"map":["#########","#.#####.#","###.v...#","#.>.#...#","#A<.va.S#","#E##a.v.#","#########"],"guards":[],"max":3,"par":2,"name":"سيور 4","hint":"الأسهم بتزقك خطوة زيادة في اتجاهها"},{"map":["#########","#<a<v.#.#","#.#.#<.<#","#.#..#a.#","#AE..##.#","#....##S#","#########"],"guards":[],"max":3,"par":2,"name":"سيور 5","hint":"الأسهم بتزقك خطوة زيادة في اتجاهها"},{"map":["#########","# function mkRng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function genLevel(seed,kind,minK){
  const rnd=mkRng(seed),ri=n=>Math.floor(rnd()*n),W=9,H=7;
  for(let att=0;att<400;att++){
    const g=[];for(let y=0;y<H;y++){g.push([]);for(let x=0;x<W;x++)g[y].push(x==0||y==0||x==W-1||y==H-1?'#':(rnd()<.2?'#':'.'))}
    const free=()=>{for(let i=0;i<200;i++){const x=1+ri(W-2),y=1+ri(H-2);if(g[y][x]==='.')return[x,y]}return null};
    let a=free();if(!a)continue;const[sx,sy]=a;g[sy][sx]='S';let e=null;for(let i=0;i<60;i++){e=free();if(e&&Math.abs(e[0]-sx)+Math.abs(e[1]-sy)>=6)break}
    if(!e)continue;g[e[1]][e[0]]='E';const guards=[];let bad=false;
    const nd=1+ri(2),cols=['a','b'];
    for(let i=0;i<nd&&!bad;i++){let p=free();if(!p){bad=true;break}g[p[1]][p[0]]=cols[i].toUpperCase();const k=1+ri(2);for(let j=0;j<k;j++){p=free();if(!p){bad=true;break}g[p[1]][p[0]]=cols[i]}}
    if(bad)continue;
    if(kind==='tele'){let p=free();if(!p)continue;g[p[1]][p[0]]='1';p=free();if(!p)continue;g[p[1]][p[0]]='1'}
    if(kind==='laser'){for(let i=0;i<3;i++){const p=free();if(p)g[p[1]][p[0]]=rnd()<.5?'l':'m'}}
    if(kind==='spike'){for(let i=0;i<3;i++){const p=free();if(p)g[p[1]][p[0]]='x'}}
    if(kind==='conv'){for(let i=0;i<5;i++){const p=free();if(p)g[p[1]][p[0]]='^v<>'[ri(4)]}}
    if(kind==='guard'){const p0=free();if(!p0)continue;const dx=rnd()<.5,p=[p0];let cx=p0[0],cy=p0[1];for(let i=0;i<3;i++){const nx=cx+(dx?1:0),ny=cy+(dx?0:1);if(g[ny]&&g[ny][nx]==='.'){cx=nx;cy=ny;p.push([cx,cy])}else break}
      if(p.length<3)continue;guards.push(p.concat(p.slice(1,-1).reverse()))}
    const def={map:g.map(r=>r.join('')),guards,max:3};let L;try{L=parseLevel(def)}catch(er){continue}
    if(guards.length&&guards[0].some(q=>!'.S'.includes(def.map[q[1]][q[0]])))continue;
    let k=-1;for(let m=0;m<=3;m++){if(solve(L,m,32)){k=m;break}}
    if(k<minK)continue;def.par=k;return def}
  return null}

 const t=cur.length-1,r=tryMove(L,clones,cur[t],t,mv);

 prevT=t;cur.push(r.pos);tickAt=performance.now();beep(mv==='W'?300:420+t*6,.06,'triangle',.05);
 if(r.dead){die();return}
 if(r.pos.x===L.exit.x&&r.pos.y===L.exit.y){win();return}
 hud()}
function die(){beep(180,.4,'sawtooth',.09,40);flash=1;shake=14;const p=cur[cur.length-1];burstCell(p,'#ef4444',24);deadUntil=performance.now()+700;
 $('hint').textContent='قبضوا عليك! الحلقة اتعادت 💥';setTimeout(()=>{cur=[{x:L.start.x,y:L.start.y}];prevT=0;tickAt=performance.now()-999;hud();$('hint').textContent=curHint},700)}
function burstCell(p,c,n){const g=geo();burst(g.ox+(p.x+.5)*g.cs,g.oy+(p.y+.5)*g.cs,c,n)}
function newLoop(){au();if(state!=='play'||cur.length<2||clones.length>=L.max)return;
 clones.push(cur.slice());burstCell(cur[cur.length-1],CLC[(clones.length-1)%5],26);beep(300,.35,'sine',.08,900);
 cur=[{x:L.start.x,y:L.start.y}];prevT=0;tickAt=performance.now()-999;hud()}
function undo(){if(state!=='play'||cur.length<2||performance.now()<deadUntil)return;cur.pop();prevT=cur.length-1;tickAt=performance.now()-999;beep(260,.06,'triangle',.04);hud()}
let demoT=null,demoUsed=false,mode='camp',cust=null,curHint='';
function demo(){au();if(state!=='play')return;restart();const sol=solve(L,L.max,48);if(!sol){$('hint').textContent='مفيش حل';return}
 const ops=[];sol.forEach((r,i)=>{r.forEach(m=>ops.push(m));if(i<sol.length-1)ops.push('N')});let i=0;state='demo';demoUsed=true;
 $('hint').textContent='💡 بتفرج على الحل: '+(sol.length-1)+' نسخ';
 clearInterval(demoT);demoT=setInterval(()=>{if(state!=='demo'){clearInterval(demoT);return}const o=ops[i++];if(o===undefined){clearInterval(demoT);return}
  state='play';if(o==='N')newLoop();else move(o);if(state==='play')state='demo'},260)}
function restart(){au();if(state!=='play')return;clones=[];cur=[{x:L.start.x,y:L.start.y}];prevT=0;tickAt=performance.now()-999;hud()}
function win(){state='won';const k=clones.length,stars=demoUsed?1:k<=L.par?3:k<=L.par+1?2:1;
 if(mode==='camp'){const old=prog[li]||0;if(stars>old)prog[li]=stars}else if(mode==='rand'){streak++;if(streak>best){best=streak;localStorage.setItem('tl_best',best)}}else if(mode==='daily'){localStorage.setItem('tl_daily',dayKey())}try{localStorage.setItem('tl_prog',JSON.stringify(prog))}catch(e){}
 beep(523,.15,'triangle',.08);setTimeout(()=>beep(659,.15,'triangle',.08),130);setTimeout(()=>beep(784,.3,'triangle',.08),260);
 burstCell(L.exit,'#fde047',40);
 setTimeout(()=>{$('wst').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('wtx').textContent=(demoUsed?'(بالحل) ':'')+'خلصتها بـ '+k+' نسخة و '+(cur.length-1)+' خطوة'+(stars<3?' (الأفضل '+L.par+' نسخة)':' 🔥');
  $('nx').style.display=(mode!=='camp'||li+1<LEVELS.length)?'':'none';$('nx').textContent=mode==='rand'?'اللغز الجاي ▶':mode==='daily'?'القايمة':'المرحلة الجاية ▶';$('win').classList.add('on')},700)}
function geo(){const W=cv.clientWidth,H=cv.clientHeight,cs=Math.floor(Math.min((W-16)/L.w,(H-16)/L.h));return{cs,ox:Math.floor((W-cs*L.w)/2),oy:Math.floor((H-cs*L.h)/2)}}
function resize(){const d=window.devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;ctx2.setTransform(d,0,0,d,0,0)}
addEventListener('resize',()=>{if(L)resize()});
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function draw(now){requestAnimationFrame(draw);if(!L||state==='menu')return;
 const c=ctx2,W=cv.clientWidth,H=cv.clientHeight,g=geo(),cs=g.cs,t=cur.length-1;
 const a=Math.min(1,(now-tickAt)/TICK),ea=a*a*(3-2*a);
 c.clearRect(0,0,W,H);c.save();if(shake>.3){c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85}
 c.translate(g.ox,g.oy);
 const ph=Math.floor(now/TICK);
 // floor+walls
 for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){
  if(L.wall[y][x]){c.fillStyle=TH[th].w;rr(c,x*cs+1,y*cs+1,cs-2,cs-2,cs*.18);c.fill();c.fillStyle=TH[th].t;rr(c,x*cs+3,y*cs+2,cs-6,cs*.3,cs*.1);c.fill()}
  else{c.fillStyle=(x+y)%2?TH[th].a:TH[th].b;c.fillRect(x*cs,y*cs,cs,cs)}}
 const acts=actorsAt(clones,cur[t],t);
 // clone paths
 clones.forEach((p,i)=>{c.strokeStyle=CLC[i%5]+'33';c.lineWidth=cs*.12;c.lineCap='round';c.beginPath();p.forEach((q,j)=>{const X=(q.x+.5)*cs,Y=(q.y+.5)*cs;j?c.lineTo(X,Y):c.moveTo(X,Y)});c.stroke()});
 // plates
 L.plates.forEach(p=>{const on=acts.some(q=>q.x===p.x&&q.y===p.y),col=COL[p.c];
  c.fillStyle=on?col:col+'33';c.strokeStyle=col;c.lineWidth=2;rr(c,p.x*cs+cs*.18,p.y*cs+cs*.18,cs*.64,cs*.64,cs*.15);c.fill();c.stroke();
  if(on){c.shadowColor=col;c.shadowBlur=18;c.stroke();c.shadowBlur=0}});
 // lasers
 for(const k in L.lasers){const [x,y]=k.split(',').map(Number),on=((t+1)>>1&1)===L.lasers[k]&&false;const ph=(((t)>>1)&1)===L.lasers[k];const soon=(((t+1)>>1)&1)===L.lasers[k];
  c.fillStyle=soon?'rgba(244,63,94,.55)':'rgba(244,63,94,.12)';c.fillRect(x*cs+2,y*cs+2,cs-4,cs-4);c.strokeStyle='#f43f5e';c.lineWidth=2;c.setLineDash([3,3]);c.strokeRect(x*cs+3,y*cs+3,cs-6,cs-6);c.setLineDash([]);
  if(soon){c.shadowColor='#f43f5e';c.shadowBlur=14;c.fillStyle='#fecdd3';c.fillRect(x*cs+cs*.15,y*cs+cs*.45,cs*.7,cs*.1);c.shadowBlur=0}}
 // conveyors
 for(const k in L.conv){const [x,y]=k.split(',').map(Number),d=L.conv[k],cx=(x+.5)*cs,cy=(y+.5)*cs;const ang={'^':-Math.PI/2,'v':Math.PI/2,'<':Math.PI,'>':0}[d];c.save();c.translate(cx,cy);c.rotate(ang);const off=((now/400)%1)*cs*.25;c.fillStyle='rgba(45,212,191,.22)';c.fillRect(-cs*.45,-cs*.45,cs*.9,cs*.9);c.strokeStyle='#2dd4bf';c.lineWidth=3;c.lineCap='round';c.lineJoin='round';for(let i=-1;i<=1;i++){const o=i*cs*.2+off-cs*.05;c.beginPath();c.moveTo(o-cs*.1,-cs*.2);c.lineTo(o+cs*.1,0);c.lineTo(o-cs*.1,cs*.2);c.stroke()}c.restore()}
 // teles
 for(const k in L.tele){const [x,y]=k.split(',').map(Number);const cx=(x+.5)*cs,cy=(y+.5)*cs;for(let i=0;i<3;i++){c.strokeStyle='rgba(168,85,247,'+(.9-i*.25)+')';c.lineWidth=2.5;c.beginPath();c.arc(cx,cy,cs*(.12+.12*i)+Math.sin(now/260-i)*cs*.03,0,6.28);c.stroke()}}
 // spikes
 for(const k in L.spikes){const [x,y]=k.split(',').map(Number);c.fillStyle='#fca5a5';for(let i=0;i<3;i++){c.beginPath();const bx=x*cs+cs*(.14+i*.28);c.moveTo(bx,y*cs+cs*.85);c.lineTo(bx+cs*.14,y*cs+cs*.2);c.lineTo(bx+cs*.28,y*cs+cs*.85);c.fill()}}
 // doors
 for(const k in L.doors){const [x,y]=k.split(',').map(Number),col=COL[L.doors[k]],open=platesOn(L,L.doors[k],acts);
  if(open){c.strokeStyle=col+'55';c.lineWidth=2;c.setLineDash([4,4]);rr(c,x*cs+3,y*cs+3,cs-6,cs-6,5);c.stroke();c.setLineDash([])}
  else{c.fillStyle=col+'cc';c.shadowColor=col;c.shadowBlur=14;rr(c,x*cs+2,y*cs+2,cs-4,cs-4,6);c.fill();c.shadowBlur=0;c.fillStyle='#0008';for(let i=1;i<4;i++)c.fillRect(x*cs+2,y*cs+i*cs/4-1,cs-4,3)}}
 // exit
 {const ex=(L.exit.x+.5)*cs,ey=(L.exit.y+.5)*cs;for(let i=0;i<4;i++){const r=cs*(.12+.1*i)+Math.sin(now/300+i)*cs*.03;c.strokeStyle='rgba(253,224,71,'+(.9-i*.2)+')';c.lineWidth=2.5;c.beginPath();c.arc(ex,ey,r,0,6.28);c.stroke()}
  c.fillStyle='#fde047';c.font=(cs*.35)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('★',ex,ey+1)}
 // guards
 L.guards.forEach((gp,i)=>{const p0=guardPos(L,i,Math.max(0,t-(a<1?1:0))),p1=guardPos(L,i,t);const q=a<1&&t>0?{x:p0.x+(p1.x-p0.x)*ea,y:p0.y+(p1.y-p0.y)*ea}:p1;
  const X=(q.x+.5)*cs,Y=(q.y+.5)*cs;c.fillStyle='#ef4444';c.shadowColor='#ef4444';c.shadowBlur=16;c.beginPath();c.moveTo(X,Y-cs*.38);c.lineTo(X+cs*.34,Y);c.lineTo(X,Y+cs*.38);c.lineTo(X-cs*.34,Y);c.closePath();c.fill();c.shadowBlur=0;
  c.fillStyle='#fff';c.beginPath();c.arc(X,Y,cs*.1,0,6.28);c.fill();c.fillStyle='#000';c.beginPath();c.arc(X,Y,cs*.05,0,6.28);c.fill()});
 // actors
 const pp=(path,tt)=>{const p1=clonePos(path,tt),p0=clonePos(path,Math.max(0,tt-1));return{x:p0.x+(p1.x-p0.x)*ea,y:p0.y+(p1.y-p0.y)*ea}};
 clones.forEach((p,i)=>{const q=pp(p,t),X=(q.x+.5)*cs,Y=(q.y+.5)*cs,col=CLC[i%5];c.globalAlpha=.8;c.fillStyle=col;c.shadowColor=col;c.shadowBlur=14;c.beginPath();c.arc(X,Y,cs*.3,0,6.28);c.fill();c.shadowBlur=0;c.globalAlpha=1;c.fillStyle='#0b1020';c.font='bold '+(cs*.3)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(i+1,X,Y+1)});
 if(performance.now()>=deadUntil){const q=pp(cur,t),X=(q.x+.5)*cs,Y=(q.y+.5)*cs;c.fillStyle='#fff';c.shadowColor='#fff';c.shadowBlur=20;c.beginPath();c.arc(X,Y,cs*.33,0,6.28);c.fill();c.shadowBlur=0;
  c.fillStyle='#0b1020';c.beginPath();c.arc(X-cs*.1,Y-cs*.04,cs*.05,0,6.28);c.arc(X+cs*.1,Y-cs*.04,cs*.05,0,6.28);c.fill()}
 c.restore();
 // particles
 c.save();c.translate(0,0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.l-=.022;c.globalAlpha=Math.max(0,p.l);c.fillStyle=p.c;c.fillRect(p.x-2,p.y-2,4,4)});c.globalAlpha=1;parts=parts.filter(p=>p.l>0);c.restore();
 if(flash>.02){c.fillStyle='rgba(239,68,68,'+flash*.35+')';c.fillRect(0,0,W,H);flash*=.9}
}
requestAnimationFrame(draw);
// menu
function buildMenu(){const m=$('lv');m.innerHTML='';LEVELS.forEach((d,i)=>{const b=document.createElement('button');const ok=i===0||prog[i-1]!==undefined;b.className='lb'+(ok?'':' lock');
 b.innerHTML='<b>'+(i+1)+'</b><span>'+d.name+'</span><i>'+(ok?('⭐'.repeat(prog[i]||0)+'☆'.repeat(3-(prog[i]||0))):'🔒')+'</i>';b.onclick=()=>{if(ok){au();loadLevel(i)}};m.appendChild(b)});
 $('dly').textContent=localStorage.getItem('tl_daily')===dayKey()?'📅 لغز اليوم ✅':'📅 لغز اليوم';$('bst').textContent=best?'🔥 أحسن سلسلة عشوائي: '+best:'';const tot=Object.values(prog).reduce((a,b)=>a+b,0);$('tot').textContent='\u2066⭐ '+tot+' / '+LEVELS.length*3+'\u2069'}
function showMenu(){state='menu';buildMenu();$('win').classList.remove('on');$('menu').classList.add('on')}
$('bm').onclick=showMenu;$('nl').onclick=newLoop;$('ud').onclick=undo;$('rs').onclick=()=>{clearInterval(demoT);if(state==='demo')state='play';restart()};$('hb').onclick=demo;$('wt').onclick=()=>move('W');
function applyTh(){cv.style.background='radial-gradient(circle at 50% 30%,'+TH[th].bg+',#070b18)'}applyTh();$('th').onclick=()=>{th=(th+1)%4;localStorage.setItem('tl_th',th);applyTh()};
$('mu').onclick=()=>{mute=!mute;localStorage.setItem('tl_mute',mute?'1':'0');$('mu').textContent=mute?'🔇':'🔊'};$('mu').textContent=mute?'🔇':'🔊';
$('nx').onclick=()=>{if(mode==='rand')startRand();else if(mode==='daily')showMenu();else loadLevel(li+1)};$('rp').onclick=()=>{if(mode==='camp')loadLevel(li);else loadDef(cust.def,cust.title)};$('wm').onclick=showMenu;
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.m)}));
const KM={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R',' ':'W'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){e.preventDefault();move(k)}else if(e.key==='n'||e.key==='Enter')newLoop();else if(e.key==='z'||e.key==='Backspace')undo();else if(e.key==='r')restart()});
let sx=0,sy=0;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))},{passive:true});
document.addEventListener('contextmenu',e=>e.preventDefault());
// test hooks
window.__tl={play(seq){const runs=seq;return runs},move,newLoop,get s(){return{state,clones:clones.length,t:cur.length-1,li}},load:loadLevel};
let streak=0,best=+(localStorage.getItem('tl_best')||0);
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function startRand(){const kinds=['spike','conv','tele','laser','guard'];const sd=(Math.random()*1e9)|0;const kind=kinds[Math.min(kinds.length-1,Math.floor(Math.random()*(1+Math.min(4,streak/2))))];
 $('menu').classList.remove('on');$('win').classList.remove('on');$('hint').textContent='بيحضّر لغز...';
 setTimeout(()=>{const def=genLevel(sd,kind,Math.min(2,1+(streak>1?1:0)))||genLevel(sd+1,'spike',1);mode='rand';def.hint='لغز عشوائي رقم '+(streak+1)+' | أحسن سلسلة: '+best;cust={def,title:'🎲 عشوائي'};loadDef(def,'🎲 عشوائي  🔥'+streak)},30)}
function startDaily(){const kinds=['spike','conv','tele','laser','guard'];const h=hash(dayKey());const def=genLevel(h,kinds[h%5],2)||genLevel(h+1,'spike',1);mode='daily';def.hint='لغز اليوم: نفسه لكل الناس النهارده';cust={def,title:'📅 لغز اليوم'};$('menu').classList.remove('on');loadDef(def,'📅 لغز اليوم')}
$('rnd').onclick=()=>{au();streak=0;startRand()};$('dly').onclick=()=>{au();startDaily()};
buildMenu();$('menu').classList.add('on');
